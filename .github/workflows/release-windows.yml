name: Générer l’installateur Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v6

      - name: Installer pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - name: Installer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: Vérifier TypeScript
        run: pnpm typecheck

      - name: Lancer les tests
        run: pnpm test

      - name: Vérifier la version du tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"

          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Le tag ${{ github.ref_name }} ne correspond pas à package.json v$version"
          }

      - name: Générer l’installateur
        run: pnpm build:win

      - name: Conserver l’installateur comme artefact
        uses: actions/upload-artifact@v4
        with:
          name: CMS-Temps-Windows-${{ github.ref_name }}
          path: release/*.exe
          if-no-files-found: error

      - name: Publier dans GitHub Releases
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = Get-ChildItem release -Filter *.exe | Select-Object -First 1

          if (-not $installer) {
            throw "Installateur Windows introuvable"
          }

          gh release view "${{ github.ref_name }}" *> $null

          if ($LASTEXITCODE -eq 0) {
            gh release upload "${{ github.ref_name }}" $installer.FullName --clobber
          } else {
            gh release create "${{ github.ref_name }}" $installer.FullName `
              --title "CMS Temps ${{ github.ref_name }}" `
              --generate-notes
          }

          if ($LASTEXITCODE -ne 0) {
            throw "La publication GitHub Release a échoué"
          }
